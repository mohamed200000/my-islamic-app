name: Build Islamic App APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Organize files, icon & Android config
        run: |
          mkdir -p lib/data lib/services lib/screens assets/data assets/audio licenses
          [ -f main.dart ] && mv main.dart lib/
          [ -f governorates.dart ] && mv governorates.dart lib/data/
          for f in data_service.dart notification_service.dart prayer_service.dart; do [ -f "$f" ] && mv "$f" lib/services/; done
          mv *_screen*.dart lib/screens/ 2>/dev/null || true
          mv *.json assets/data/ 2>/dev/null || true
          mv *.mp3 assets/audio/ 2>/dev/null || true
          mv *-NOTICE.txt *-LICENSE-MIT.md licenses/ 2>/dev/null || true
          [ ! -d "android" ] && flutter create . --org com.islamicapp --platforms android
          mkdir -p android/app/src/main/res/raw
          [ -f assets/audio/adhan_4_egypt.mp3 ] && cp assets/audio/adhan_4_egypt.mp3 android/app/src/main/res/raw/adhan.mp3
          pip install -q pillow
          python3 -c '
          import os, re
          p="android/app/src/main/AndroidManifest.xml"
          s=open(p,encoding="utf-8").read()
          s=re.sub(r"android:label=\"[^\"]*\"", "android:label=\"آثر المؤذن\"", s, count=1)
          perms=["INTERNET","ACCESS_FINE_LOCATION","ACCESS_COARSE_LOCATION","POST_NOTIFICATIONS","SCHEDULE_EXACT_ALARM","RECEIVE_BOOT_COMPLETED"]
          ins="\n    ".join(f"<uses-permission android:name=\"android.permission.{x}\"/>" for x in perms if x not in s)
          if ins: s=s.replace("<application",f"    {ins}\n    <application",1)
          open(p,"w",encoding="utf-8").write(s)
          kts="android/app/build.gradle.kts"
          gr="android/app/build.gradle"
          if os.path.exists(kts):
              g=open(kts).read()
              if "isCheckReleaseBuilds" not in g:
                  g=g.replace("android {","android {\n    lint {\n        isCheckReleaseBuilds = false\n        isAbortOnError = false\n    }",1)
              if "isCoreLibraryDesugaringEnabled" not in g:
                  g=g.replace("compileOptions {","compileOptions {\n        isCoreLibraryDesugaringEnabled = true",1)
                  g+="\ndependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.1.4\")\n}\n"
              open(kts,"w").write(g)
          elif os.path.exists(gr):
              g=open(gr).read()
              if "checkReleaseBuilds" not in g:
                  g=g.replace("android {","android {\n    lintOptions {\n        checkReleaseBuilds false\n        abortOnError false\n    }",1)
              if "coreLibraryDesugaringEnabled" not in g:
                  g=g.replace("compileOptions {","compileOptions {\n        coreLibraryDesugaringEnabled true",1)
                  g+="\ndependencies {\n    coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:2.1.4\"\n}\n"
                  open(gr,"w").write(g)
          icon=next((f for f in ["app_icon.jpg","app_icon.png"] if os.path.exists(f)),None)
          if icon:
              from PIL import Image
              im=Image.open(icon).convert("RGBA")
              for d,sz in [("mdpi",48),("hdpi",72),("xhdpi",96),("xxhdpi",144),("xxxhdpi",192)]:
                  out=f"android/app/src/main/res/mipmap-{d}/ic_launcher.png"
                  os.makedirs(os.path.dirname(out),exist_ok=True)
                  im.resize((sz,sz),Image.LANCZOS).save(out,"PNG")
          '
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: islamic-app-apk
          path: build/app/outputs/flutter-apk/*-release.apk
