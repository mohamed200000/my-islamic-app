name: islamic_app
description: تطبيق مواقيت الصلاة والأذكار والقرآن الكريم (نسخة Flutter)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  audioplayers: ^6.0.0
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  geolocator: ^13.0.1
  flutter_compass: ^0.8.0
  hijri: ^3.0.0
  url_launcher: ^6.3.0
  webview_flutter: ^4.8.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/audio/
    - licenses/
